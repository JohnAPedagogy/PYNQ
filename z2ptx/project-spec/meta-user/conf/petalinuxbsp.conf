#User Configuration

#OE_TERMINAL = "tmux"

# Skip qemu-xilinx-native due to compilation failure with glibc 2.41
ASSUME_PROVIDED += "qemu-native"

# Use pre-generated device tree from workspace
SYSTEM_DTFILE = "${PROOT}/components/plnx_workspace/device-tree/device-tree/system-top.dts"

# Use dummy FSBL to satisfy dependency without requiring xsct
PREFERRED_PROVIDER_virtual/fsbl = "fsbl"
